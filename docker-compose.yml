services:
  db:
    image: postgres:16-alpine
    container_name: bingequeue-db
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: bingequeue
      POSTGRES_PASSWORD: bingequeue
      POSTGRES_DB: bingequeue
    volumes:
      - bingequeue_pgdata:/var/lib/postgresql/data

volumes:
  bingequeue_pgdata:
